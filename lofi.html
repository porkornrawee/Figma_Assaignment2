<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>Lofi-Redesign-CSTU</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {margin:0;padding:0;width:380px;height:800px;overflow:hidden;font-family:'Sarabun',sans-serif;background:#FFFFFF;}
    .top {height:56px;background:#E0E0E0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
    .rect {background:#BDBDBD;border-radius:4px;}
    .hero {height:160px;background:#F5F5F5;border-bottom:1px solid #E0E0E0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .quick {height:100px;background:#FFFFFF;}
    .quick-label {color:#9E9E9E;font-size:12px;padding:8px 16px;}
    .cards {display:flex;gap:8px;padding:0 16px;}
    .card {flex:1;background:#F5F5F5;border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;}
    .circle {background:#BDBDBD;border-radius:50%;width:32px;height:32px;margin-bottom:8px;}
    .news-label {color:#9E9E9E;font-size:12px;padding:8px 16px;border-top:1px solid #E0E0E0;}
    .news-card {background:#FFFFFF;border-bottom:1px solid #E0E0E0;padding:16px;}
    .placeholder {background:#BDBDBD;}
    .bottom {height:56px;background:#E0E0E0;display:flex;justify-content:space-around;align-items:center;}
  </style>
</head>
<body>
  <div class="top">
    <div class="rect" style="width:24px;height:24px;">&nbsp;</div>
    <div class="rect" style="width:80px;height:20px;">&nbsp;</div>
    <div class="rect" style="width:24px;height:24px;">&nbsp;</div>
  </div>
  <div class="hero">
    <div class="rect" style="width:200px;height:28px;margin-bottom:8px;">&nbsp;</div>
    <div class="rect" style="width:240px;height:16px;margin-bottom:8px;">&nbsp;</div>
    <div class="rect" style="width:120px;height:40px;border-radius:8px;">&nbsp;</div>
  </div>
  <div class="quick">
    <div class="quick-label">Quick Links</div>
    <div class="cards">
      <div class="card"><div class="circle"></div><div class="rect placeholder" style="width:48px;height:12px;"></div></div>
      <div class="card"><div class="circle"></div><div class="rect placeholder" style="width:48px;height:12px;"></div></div>
      <div class="card"><div class="circle"></div><div class="rect placeholder" style="width:48px;height:12px;"></div></div>
    </div>
  </div>
  <div class="news-label">ข่าวสาร / News</div>
  <div class="news-card">
    <div class="rect placeholder" style="width:60px;height:12px;margin-bottom:8px;"></div>
    <div class="rect placeholder" style="width:240px;height:20px;margin-bottom:8px;"></div>
    <div class="rect placeholder" style="width:280px;height:14px;margin-bottom:4px;"></div>
    <div class="rect placeholder" style="width:200px;height:14px;"></div>
  </div>
  <div class="news-card">
    <div class="rect placeholder" style="width:60px;height:12px;margin-bottom:8px;"></div>
    <div class="rect placeholder" style="width:240px;height:20px;margin-bottom:8px;"></div>
    <div class="rect placeholder" style="width:280px;height:14px;margin-bottom:4px;"></div>
    <div class="rect placeholder" style="width:200px;height:14px;"></div>
  </div>
  <div class="bottom">
    <div class="rect" style="width:24px;height:24px;"></div>
    <div class="rect" style="width:24px;height:24px;"></div>
    <div class="rect" style="width:24px;height:24px;"></div>
    <div class="rect" style="width:24px;height:24px;"></div>
  </div>
</body>
</html>
