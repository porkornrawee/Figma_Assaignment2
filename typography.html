<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>Section Font</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {margin:0;padding:24px;font-family:'Sarabun',sans-serif;background:#FFFFFF;width:380px;box-sizing:border-box;}
    h2 {font-size:20px;color:#1A1A1A;margin-bottom:24px;}
    .row {padding:12px 0;border-bottom:1px solid #E0E0E0;}
    .label {font-size:12px;color:#666666;margin-top:4px;}
  </style>
</head>
<body>
  <h2>Section Font</h2>
  <div class="row"><div style="font-weight:700;font-size:24px;">H1 — Sarabun Bold 24px</div><div class="label">Heading 1 / Bold / 24px</div></div>
  <div class="row"><div style="font-weight:600;font-size:18px;">H2 — Sarabun SemiBold 18px</div><div class="label">Heading 2 / SemiBold / 18px</div></div>
  <div class="row"><div style="font-weight:400;font-size:14px;">Body — Sarabun Regular 14px</div><div class="label">Body Text / Regular / 14px</div></div>
  <div class="row" style="border-bottom:none;"><div style="font-weight:400;font-size:12px;">Caption — Sarabun Regular 12px</div><div class="label">Caption / Regular / 12px</div></div>
</body>
</html>
